; ---------------------------------------------------------------------------
; Online Subsystem
;
; Default to the NULL subsystem, which provides LAN host/find/join with no
; external service or account. This is what lets a desktop client join a
; session out of the box. To enable online (internet) play, set DefaultPlatformService
; to Steam (or another provider) and add the matching [OnlineSubsystemSteam] block.
; ---------------------------------------------------------------------------
[OnlineSubsystem]
DefaultPlatformService=Null

[OnlineSubsystemNull]
bEnabled=true

[/Script/OnlineSubsystemUtils.OnlineSession]
DefaultPlatformService=Null

